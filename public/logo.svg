<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient)"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="white-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F3F4F6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Document/Note Background -->
  <rect x="140" y="120" width="232" height="300" rx="16" fill="white" opacity="0.95"/>

  <!-- Document Lines (representing notes) -->
  <line x1="180" y1="180" x2="332" y2="180" stroke="#6B7280" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="220" x2="332" y2="220" stroke="#6B7280" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="260" x2="280" y2="260" stroke="#6B7280" stroke-width="8" stroke-linecap="round"/>

  <!-- Rocket/Ship Element -->
  <g transform="translate(256, 320)">
    <!-- Rocket Body -->
    <path d="M 0,-80 L 20,-20 L 20,40 C 20,50 10,60 0,60 C -10,60 -20,50 -20,40 L -20,-20 Z" fill="url(#gradient)"/>

    <!-- Rocket Window -->
    <circle cx="0" cy="-40" r="12" fill="white" opacity="0.8"/>

    <!-- Rocket Flames -->
    <path d="M -12,60 Q -15,75 -8,85" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 0,60 Q 0,80 0,90" stroke="#EF4444" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 12,60 Q 15,75 8,85" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Rocket Fins -->
    <path d="M -20,20 L -40,40 L -20,40 Z" fill="#1E40AF"/>
    <path d="M 20,20 L 40,40 L 20,40 Z" fill="#1E40AF"/>
  </g>

  <!-- Sparkle Elements -->
  <g opacity="0.6">
    <path d="M 380,140 L 385,150 L 395,155 L 385,160 L 380,170 L 375,160 L 365,155 L 375,150 Z" fill="white"/>
    <path d="M 120,200 L 123,206 L 129,209 L 123,212 L 120,218 L 117,212 L 111,209 L 117,206 Z" fill="white"/>
    <path d="M 400,300 L 404,308 L 412,312 L 404,316 L 400,324 L 396,316 L 388,312 L 396,308 Z" fill="white"/>
  </g>
</svg>
